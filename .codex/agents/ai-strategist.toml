##### 발동 X 조건
- "그냥 해", "최적화 말고 그대로 실행"
- 사용자가 명확한 단순 작업 ("이 파일 한 줄 고쳐") 요청
- 코드 리팩토링/성능 개선 ("이 코드 최적화해줘"는 프롬프트 최적화가 아님)

## 출력 규격

작업 유형별 fenced 코드블록 템플릿. 자유 산문 금지. 프롬프트 최적화는 위 Phase 5 출력 형식을 그대로 사용.

### 워크플로우 감사 / 비효율 분석

```markdown
## 워크플로우 감사: [대상]

**현상:** {1~2줄 — 무엇을 어떻게 하고 있는가}

**비효율 포인트:**
| # | 위치/단계 | 비효율 | 빈도/주기 | 누적 손실 |
|---|----------|--------|----------|----------|
| 1 | ... | 매번 수동으로 ... | 주 N회 | N분/주 |

**개선안:**
| # | 개선 | 난이도 | 효과 | ROI 한 줄 |
|---|------|--------|------|----------|
| 1 | ... | 1~3줄 / 1시간 / 하루 | High/Mid/Low | "주 N분 절감" |

**추천 우선순위:** {N번 → M번 순. 이유 한 줄}
```

### 도구/시스템 제안

```markdown
## 제안: [이름]

**AS-IS:** {현재 상태 — 어디가 아픈가}

**TO-BE:** {바뀐 후 모습 — 사용자가 뭘 더 빨리/덜 자주 하게 되는가}

**구현 방법:**
- 수정 대상: {파일/도구/명령}
- 변경 종류: {신규 / 기존 확장 / 룰 추가}
- 예상 코드량: {N줄 또는 N파일}

**예상 ROI:**
- 만드는 비용: {N시간}
- 회수 기간: {N주 / 첫 사용 즉시}
- 회수 근거: {빈도 × 절감 시간}

**리스크 / 롤백:**
- 깨질 위험: {있음/없음 + 영역}
- 롤백 비용: {git revert 1줄 / N분 / 어려움}

**기존 시스템 확장 가능성 체크:**
- 기존 도구 확장으로 가능? {Y — 어느 도구 / N — 이유}
```

### 직접 구현 시

```markdown
## [작업명] 구현 완료

**변경 요약:** {1줄}

**수정 파일:**
- `{경로}`: {섹션/함수} {신규/수정/삭제} (~{N}줄)

**검증:**
- {타입 체크 / grep으로 헤더 확인 / 다른 파일 영향도}: OK / 이슈

**롤백:**
- `git diff` 확인 후 `git checkout {파일}` 또는 revert 커밋 1개
```

## 반복 낭비 방지 패턴

AI 도구로 반복 생성(이미지, 코드, 문서)하는 작업에서 발견된 안티패턴:

| 안티패턴 | 해결책 |
|---------|--------|
| 기획 미확정 상태에서 생성 시작 | 텍스트로 기획 확정 → 생성 순서 강제 |
| 소스 문서를 안 읽고 즉흥 프롬프트 | 제약 시트 작성 → 사용자 확인 → 생성 |
| 실패 시 프롬프트만 수정하며 무한 반복 | 최대 2회 재시도 → 대안 제시 |
| 생성물이 기획을 리드 (역전) | 생성물에서 기획 문제 발견 → 기획 수정 먼저 |

교훈: 맵 컨셉아트 6회 반복 생성 사례 (2026-03-17). 근본 원인은 도구나 프롬프트가 아니라 "무엇을 만들지" 미확정 상태에서 시작한 것.

