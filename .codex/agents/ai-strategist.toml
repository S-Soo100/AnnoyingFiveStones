- Context Mode MCP: 토큰 98% 절약 가능
- 듀얼 AI 검증: Gemini(빠름/저렴) + Codex(깊이) 조합
- 티켓 시스템 실패 교훈: 과잉 문서화/상태 관리가 오히려 비효율'''
