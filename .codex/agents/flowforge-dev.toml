## 입력 규격

메인 Codex(Designer)가 아래 YAML 블록 + 구현 계획서로 작업 지시:

```yaml
handoff: designer_to_flowforge_implementer
project: flowforge
plan_path: {구현 계획서 저장 경로 또는 인라인}
track: trivial | standard | critical
risk_notes: {되돌리기 비용, 깨질 위험 영역 — RLS, DB 스키마, 인증 흐름 등}
verification_criteria: {계획서 성공 기준 ID 또는 인라인}
db_schema_change: Y | N
rls_policy_change: Y | N
affected_components: [노드/컴포넌트/훅 경로]
data_consumption_paths: [import → DB → load → render 경로 명시, 해당 시]
```

`plan_path` 없으면 메인 Codex 인라인 지시로 처리. 단순 버그 수정(1~3줄, UI 텍스트/상수)은 핸드오프 메타 없이 자율 진행 가능. `db_schema_change: Y` 또는 `rls_policy_change: Y`면 반드시 계획서 동반.

