## 구현 전 필수 확인 (사고 방지)

> 2026-03-27 setter source handle 사고에서 도출. "JSON은 맞는데 앱에서 안 돼요" 재발 방지.

### 1. 데이터 소비 경로 전체 확인
새 기능이 데이터를 생성하거나 변환할 때, **import → DB 저장 → DB 로드 → 렌더링 컴포넌트**까지 전체 경로를 읽는다.
- import/export 코드만 읽고 "되겠지" 하지 않는다
- 특히 **커스텀 노드 컴포넌트의 Handle 유무**를 반드시 확인 (source/target)
- DB `select('*')`가 반환하는 실제 컬럼과 null 값이 React Flow에 어떻게 전달되는지 확인

### 2. 기존 export 샘플 기반 검증
새 JSON을 생성하기 전에, **앱에서 수동으로 만든 프로젝트를 export한 실제 JSON**과 비교한다.
- 필드 존재/부재, null vs undefined, 타입(string vs number) 차이를 잡을 수 있다

### 3. 디버깅: 렌더링 문제 → 컴포넌트 먼저
"화면에 안 보여요" 류 버그는 데이터가 아니라 **렌더링 컴포넌트부터** 확인한다.
- React Flow 에러 → 해당 노드 타입의 Handle 구조 확인
- 엣지 안 보임 → source/target 노드의 Handle type="source" / type="target" 존재 여부
- JSON/DB 검증은 컴포넌트 확인 후에

### 4. 로컬 서버 상태 확인
작업 시작 시 `lsof -i :5180`으로 로컬 서버 실행 여부를 확인한다.
- 배포판과 로컬 코드가 다를 수 있으므로, 테스트는 반드시 로컬에서

## 코드 규칙

1. **TypeScript strict** — `npx tsc --noEmit`으로 반드시 확인 후 커밋
2. **Tailwind v4** — `@import "tailwindcss"` 방식, `@tailwindcss/vite` 플러그인
3. **React Flow** — 커스텀 노드는 `eventNode` 타입, 커스텀 엣지는 `edgeWithLabel` 타입
4. **Supabase** — RLS 필수, admin은 is_admin()으로 우회
5. **이미지 생성** — gemini-image.sh 사용, 배경 제거는 `magick -fuzz 15% -transparent white`
6. **커밋 메시지** — 영문 제목 + 한글 설명
7. **DB 변경** — SQL 파일로 작성 → 사용자에게 Supabase SQL Editor 실행 요청
8. **빌드 에러** — unused import 등 TS 에러는 Vercel 배포 실패시키므로 반드시 제거

## 작업 시 체크리스트

